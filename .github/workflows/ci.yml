name: Quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Python lint and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install existing backend package and quality tools
        working-directory: backend
        run: python -m pip install -e '.[quality]'
      - name: Ruff lint
        working-directory: backend
        run: ruff check app tests scripts
      - name: Ruff formatting gate
        working-directory: backend
        run: python scripts/check_format.py
      - name: Summary
        if: always()
        run: |
          echo 'Python lint and formatting: ${{ job.status }}' >> "$GITHUB_STEP_SUMMARY"

  backend-tests:
    name: Backend pytest
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ''
      GEMINI_API_KEY: ''
      ARCHMIND_RUN_PROJECT_INDEX_REMOTE_TEST: '0'
      ARCHMIND_RUN_WORKFLOW_REMOTE_TEST: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install existing backend package and test tools
        working-directory: backend
        run: python -m pip install -e '.[test]'
      - name: Run unit tests without cloud credentials
        working-directory: backend
        run: python -m pytest -q --tb=short
      - name: Summary
        if: always()
        run: |
          echo 'Backend pytest (no cloud credentials): ${{ job.status }}' >> "$GITHUB_STEP_SUMMARY"

  contracts-and-prompts:
    name: API contract and runtime prompts
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ''
      GEMINI_API_KEY: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and OpenAPI validator
        working-directory: backend
        run: python -m pip install -e '.[quality]'
      - name: Validate OpenAPI and tracked export
        working-directory: backend
        run: python scripts/check_openapi.py
      - name: Validate every runtime prompt release
        working-directory: backend
        run: python -m app.prompts.validate
      - name: Summary
        if: always()
        run: |
          echo 'OpenAPI and runtime prompt validation: ${{ job.status }}' >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend lint, types, tests, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install from npm lockfile
        working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: TypeScript
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Verify generated API types
        working-directory: frontend
        run: |
          cp src/lib/api/schema.d.ts "$RUNNER_TEMP/archmind-schema.d.ts"
          npm run api:types
          cmp "$RUNNER_TEMP/archmind-schema.d.ts" src/lib/api/schema.d.ts
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Summary
        if: always()
        run: |
          echo 'Frontend lint, types, tests, API types, and build: ${{ job.status }}' >> "$GITHUB_STEP_SUMMARY"

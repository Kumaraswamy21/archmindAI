[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archmind-ai-backend"
version = "0.1.0"
description = "Read-only repository intelligence and architecture analysis platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3,<4",
    "alembic>=1.13,<2",
    "google-genai>=2.29,<3",
    "langgraph>=1.2.18,<1.3",
    "langfuse>=3.2,<4",
    "pgvector>=0.5,<1",
    "httpx>=0.27,<1",
    "tree-sitter==0.26.0",
    "tree-sitter-java==0.23.5",
    "uvicorn>=0.30,<1",
    "tomli>=2,<3; python_version<'3.11'",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]
quality = [
    "ruff==0.12.0",
    "openapi-spec-validator>=0.7,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.prompts" = ["registry.toml", "templates/*/*/*.md"]
"app.modules.evaluation" = ["datasets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"tests/test_chat.py" = ["F811"]
"tests/test_observability.py" = ["F811"]
